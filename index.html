<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cello Giyim — İstanbul Bağcılar Erkek Giyim</title>
<meta name="description" content="Cello Giyim: 18 yıldır İstanbul Bağcılar'da. Mont, sweat ve kazak modelleri. Türkiye'nin her yerine kargo, Havale/EFT ile ödeme.">
<meta property="og:type" content="website">
<meta property="og:title" content="Cello Giyim — Online Mağaza">
<meta property="og:description" content="18 yıldır İstanbul Bağcılar'da. Mont, sweat ve kazak modelleri, Türkiye'nin her yerine kargo.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --red:#d7102f; --red-d:#b00c26; --ink:#111111; --muted:#6b6b6b; --line:#e6e6e6;
  --soft:#f4f4f4; --tile:#f1f1f1; --green:#25d366; --green-d:#128c4b;
  --f:'Poppins',system-ui,-apple-system,Segoe UI,sans-serif; --max:1220px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--f);font-size:14px;color:var(--ink);background:#fff;line-height:1.5;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,textarea{font-family:inherit;font-size:14px}
svg{display:block}
.wrap{max-width:var(--max);margin:0 auto;padding:0 22px}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* TOP BAR */
.topbar{background:#ededed;font-size:12.5px;color:#333}
.topbar .in{display:flex;justify-content:space-between;align-items:center;height:36px;gap:12px}
.topbar b{color:var(--red);font-weight:600}
.topbar .r{display:flex;gap:18px;font-weight:500}
.topbar a:hover{color:var(--red)}

/* HEADER */
header{position:sticky;top:0;z-index:60;background:#fff;border-bottom:1px solid var(--line)}
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:76px}
.menu-btn{display:flex;align-items:center;gap:10px;font-weight:500;font-size:13px;justify-self:start;padding:6px 0}
.logo{display:flex;align-items:baseline;gap:7px;font-weight:900;font-size:28px;letter-spacing:-.03em;line-height:1}
.logo .a{color:var(--red)}
.logo .b{color:var(--ink)}
.hd-r{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.icon-btn{position:relative;width:42px;height:42px;display:grid;place-items:center;border-radius:50%;transition:background .15s}
.icon-btn:hover{background:var(--soft)}
.badge{position:absolute;top:3px;right:1px;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:10.5px;font-weight:600;display:grid;place-items:center;padding:0 4px;line-height:1}
.search-row{display:none;padding:0 0 14px}
.search-row.open{display:block}
.search{display:flex;background:var(--soft);border-radius:4px;overflow:hidden}
.search input{flex:1;border:none;background:transparent;padding:13px 16px;outline:none}
.search button{padding:0 20px;font-weight:600;letter-spacing:.02em}
.search button:hover{color:var(--red)}

/* HERO */
.hero{margin-top:26px}
.hero-box{position:relative;overflow:hidden;background:#efefef;border-radius:4px;display:grid;grid-template-columns:1.08fr .92fr;min-height:480px}
.hero-l{position:relative;z-index:3;padding:46px 0 38px 54px;display:flex;flex-direction:column;align-items:flex-start}
.dots{position:absolute;width:46px;height:74px;background-image:radial-gradient(var(--red) 2.3px,transparent 2.8px);background-size:14px 14px;z-index:2}
.dots.tl{top:14px;left:20px}
.dots.br{right:22px;bottom:16px;width:60px;height:46px;background-image:radial-gradient(#fff 2.3px,transparent 2.8px);z-index:4}
.tilt{display:inline-block;background:var(--red);color:#fff;font-weight:800;font-size:clamp(14px,2.1vw,30px);padding:.18em .7em;transform:rotate(-4deg);box-shadow:0 6px 0 rgba(0,0,0,.12);letter-spacing:.01em;text-transform:uppercase}
.big{font-weight:900;font-size:clamp(34px,6.6vw,94px);line-height:.92;letter-spacing:-.035em;margin-top:.34em;text-transform:uppercase}
.from{font-weight:700;font-size:clamp(12px,1.4vw,19px);margin-top:.9em;text-transform:uppercase;letter-spacing:.02em;color:#333}
.pricebox{display:inline-block;background:var(--red);color:#fff;font-weight:900;font-size:clamp(32px,6.2vw,88px);line-height:1;padding:.06em .32em .12em;transform:skewX(-9deg);border-radius:.12em;margin-top:.12em;box-shadow:0 .1em 0 rgba(0,0,0,.14);letter-spacing:-.03em}
.pricebox span{display:inline-block;transform:skewX(9deg)}
.pricebox small{font-size:.32em;font-weight:700;letter-spacing:0;margin-left:.15em}
.feats{display:flex;margin-top:24px}
.feat{display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 22px;border-left:1.5px solid #c9c9c9}
.feat:first-child{border-left:none;padding-left:0}
.feat .fi{width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;margin-bottom:8px}
.feat .fi .ico{width:22px;height:22px;stroke-width:2}
.feat .ft{font-weight:700;font-size:12.5px;text-transform:uppercase;line-height:1.2}
.feat .fs{font-size:10.5px;font-weight:600;text-transform:uppercase;color:#444;margin-top:2px}
.cta{display:inline-flex;align-items:center;gap:12px;background:var(--red);color:#fff;border-radius:40px;padding:8px 22px 8px 8px;font-weight:700;font-size:clamp(12px,1.45vw,19px);margin-top:26px;box-shadow:0 6px 16px rgba(215,16,47,.35);transition:background .15s,transform .12s;text-transform:uppercase}
.cta:hover{background:var(--red-d)}.cta:active{transform:scale(.98)}
.cta .ci{width:2.1em;height:2.1em;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center}
.cta .ci .ico{width:1.1em;height:1.1em;stroke-width:2.2}
.hero-r{position:relative;overflow:hidden}
.hero-r img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 30%}
.hero-r:before{content:"";position:absolute;top:-10%;bottom:-10%;left:-28%;width:46%;background:var(--red);transform:skewX(-16deg);z-index:2;box-shadow:12px 0 0 rgba(255,255,255,.85)}
.seal{position:absolute;z-index:5;left:51%;top:50%;transform:translate(-50%,-50%);width:clamp(74px,12vw,160px);height:clamp(74px,12vw,160px);border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;text-align:center;font-weight:800;font-size:clamp(10px,1.45vw,19px);line-height:1.15;text-transform:uppercase;box-shadow:0 0 0 5px #fff,0 0 0 7px var(--red),0 10px 24px rgba(0,0,0,.25)}
.seal b{display:block;font-size:2em;line-height:1;font-weight:900}
.seal:after{content:"";position:absolute;inset:7%;border:2px dashed rgba(255,255,255,.7);border-radius:50%}
.slash{position:absolute;z-index:4;left:43%;bottom:6%;width:70px;height:40px;background:repeating-linear-gradient(115deg,var(--red) 0 4px,transparent 4px 13px)}

/* TILES */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px}
.tile{position:relative;aspect-ratio:1/1;overflow:hidden;border-radius:2px;background:var(--tile);cursor:pointer}
.tile.prod{display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;padding:5% 5% 4.5%}
.tile .tt{font-weight:800;font-size:clamp(15px,2.5vw,34px);line-height:1.02;text-transform:uppercase;letter-spacing:-.01em;position:relative;z-index:2}
.tile.prod .im{position:absolute;left:4%;right:4%;top:17%;bottom:29%}
.tile.prod .im img{position:absolute;top:0;left:50%;height:100%;width:auto;max-width:none;transform:translateX(-50%);transition:transform .5s;-webkit-mask-image:radial-gradient(ellipse 72% 72% at 50% 50%,#000 62%,transparent 100%);mask-image:radial-gradient(ellipse 72% 72% at 50% 50%,#000 62%,transparent 100%)}
.tile.prod .bot{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center}
.tile:hover .im img{transform:translateX(-50%) scale(1.04)}
.tile:hover>img{transform:scale(1.04)}
.tile .pp{font-weight:900;font-size:clamp(28px,4.6vw,62px);line-height:.95;letter-spacing:-.04em;position:relative;z-index:2}
.tile .op{font-size:clamp(11px,1.3vw,17px);font-weight:600;color:#777;text-decoration:line-through;margin-bottom:2px}
.pill{display:inline-flex;align-items:center;gap:8px;background:#111;color:#fff;border-radius:7px;padding:.45em 1.1em;font-weight:600;font-size:clamp(11px,1.25vw,16px);margin-top:.55em;position:relative;z-index:2;transition:background .15s}
.pill .ico{width:1.15em;height:1.15em;stroke-width:2}
.tile:hover .pill{background:var(--red)}
.tile.cat>img{position:absolute;left:-10%;top:15%;width:120%;max-width:none;height:92%;object-fit:cover;object-position:center top;transition:transform .5s}
.tile.cat .cin{position:absolute;inset:0;padding:5.5%;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;z-index:2}
.tile.cat .tt{font-size:clamp(17px,3vw,40px);text-align:left}
.tile.cat.dark .tt{color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.tile.cat .pill{background:#fff;color:#111;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tile.cat:hover .pill{background:var(--red);color:#fff}
.tile.cat:before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,var(--tb) 16%,transparent 34%)}
.tile.red{background:var(--red);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;padding:8%}
.tile.red .tt{font-size:clamp(18px,3vw,40px)}
.tile.red p{font-size:clamp(11px,1.25vw,16px);opacity:.92;margin-top:.7em;max-width:24ch}
.tile.red .pill{background:#fff;color:var(--red);margin-top:1.2em}
.tile.red:hover .pill{background:#111;color:#fff}
.tile.red:after{content:"";position:absolute;right:-18%;bottom:-18%;width:60%;height:60%;border-radius:50%;border:22px solid rgba(255,255,255,.12)}

/* SECTION TITLE */
.sec-title{display:flex;align-items:center;gap:26px;margin:58px 0 24px}
.sec-title:before,.sec-title:after{content:"";flex:1;height:1px;background:#d6d6d6}
.sec-title h2{font-weight:700;font-size:clamp(19px,2.4vw,30px);text-transform:uppercase;text-align:center}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:28px}
.chip{padding:8px 16px;border-radius:6px;border:1px solid var(--line);font-size:13px;font-weight:600;color:#444;background:#fff;transition:all .15s}
.chip:hover{border-color:#111;color:#111}
.chip.active{background:#111;border-color:#111;color:#fff}
.result-note{text-align:center;color:var(--muted);font-size:13px;margin:-14px 0 22px}

/* PRODUCT GRID */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:34px 22px}
.card{display:flex;flex-direction:column}
.card .ph{position:relative;aspect-ratio:3/4;overflow:hidden;cursor:pointer;background:var(--soft)}
.card .ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.card .ph img.contain{object-fit:contain}
.card:hover .ph img{transform:scale(1.04)}
.rb{position:absolute;top:12px;right:12px;background:var(--red);color:#fff;font-size:12px;font-weight:600;padding:3px 11px;border-radius:20px;z-index:2}
.rb.new{background:#111}
.card .qv{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,255,255,.96);color:#111;font-size:12.5px;font-weight:600;text-align:center;padding:10px;border-radius:4px;transform:translateY(130%);transition:transform .25s;z-index:2}
.card:hover .qv{transform:none}
.card .nm{font-size:15px;margin-top:14px;line-height:1.35;cursor:pointer}
.card .nm:hover{color:var(--red)}
.card .sr{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:.02em}
.card .prow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.prc{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:8px}
.oldp{font-size:13px;color:#8a8a8a;text-decoration:line-through;font-weight:500}
.np{font-weight:700;font-size:18px;letter-spacing:-.01em}
.fav{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;flex-shrink:0;transition:background .15s,color .15s}
.fav:hover{background:var(--soft)}
.fav.on{color:var(--red)}
.fav.on .ico{fill:var(--red)}
.addbtn{height:42px;border-radius:4px;background:#111;color:#fff;font-weight:600;font-size:13px;transition:background .15s;white-space:nowrap;padding:0 10px}
.addbtn:hover{background:var(--red)}
.card .addbtn{margin-top:12px;width:100%}
.empty-res{grid-column:1/-1;text-align:center;padding:50px 20px;color:var(--muted)}
.empty-res button{margin-top:14px;text-decoration:underline;font-weight:600;color:#111}

/* STORE */
.store{margin-top:70px;background:#111;color:#fff;border-radius:6px;overflow:hidden;display:grid;grid-template-columns:1.25fr 1fr;position:relative}
.store:before{content:"";position:absolute;right:-8%;top:-30%;width:46%;height:160%;background:var(--red);transform:skewX(-16deg);opacity:.95}
.store-l{position:relative;z-index:2;padding:52px 48px}
.store .ey{font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#ff4d67}
.store h2{font-size:clamp(26px,3.4vw,44px);font-weight:800;line-height:1.08;letter-spacing:-.02em;margin:10px 0 14px}
.store p{color:rgba(255,255,255,.72);font-size:15px;line-height:1.7;max-width:46ch}
.store-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.sbtn{display:inline-flex;align-items:center;gap:9px;height:46px;padding:0 20px;border-radius:6px;font-weight:600;font-size:14px;transition:all .15s}
.sbtn .ico{width:19px;height:19px}
.sbtn.r{background:var(--red);color:#fff}.sbtn.r:hover{background:#fff;color:var(--red)}
.sbtn.o{border:1.5px solid rgba(255,255,255,.4)}.sbtn.o:hover{border-color:#fff;background:rgba(255,255,255,.08)}
.sbtn.g{background:var(--green);color:#fff}.sbtn.g:hover{background:var(--green-d)}
.store-r{position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:44px 48px 44px 120px}
.stat .n{font-size:clamp(40px,5vw,64px);font-weight:900;line-height:1;letter-spacing:-.03em}
.stat .l{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.9;margin-top:4px}

/* STEPS */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.step{border:1px solid var(--line);border-radius:8px;padding:26px 24px;position:relative;background:#fff}
.step .no{width:42px;height:42px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px}
.step h4{font-size:17px;font-weight:700;margin:14px 0 6px}
.step p{color:#555;font-size:14px;line-height:1.65}

/* TRUST */
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-top:64px;padding-top:40px;border-top:1px solid var(--line)}
.tr{display:flex;align-items:center;gap:18px;border:1px solid var(--line);border-radius:8px;padding:24px 20px;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.tr .ico{width:42px;height:42px;stroke-width:1.4;flex-shrink:0}
.tr .tt{font-weight:700;font-size:16.5px;color:var(--red);text-transform:uppercase;line-height:1.2}
.tr .ts{font-size:13.5px;color:#333;margin-top:4px;line-height:1.45}

/* KEYWORDS + ABOUT + FAQ */
.kw{margin-top:48px}
.kw h4{font-size:13px;font-weight:500;text-transform:uppercase;margin-bottom:14px}
.kw .chips{justify-content:flex-start;margin:0}
.about{margin-top:52px}
.about h2{font-weight:400;font-size:clamp(22px,2.6vw,30px);margin-bottom:14px}
.about p{font-size:14px;line-height:1.75;color:#222;max-width:110ch}
.faq-wrap{margin-top:30px;max-width:860px}
.faq{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:17px 0;font-weight:600;font-size:15px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.faq summary::-webkit-details-marker{display:none}
.faq summary .pl{color:var(--red);font-size:20px;font-weight:400;transition:transform .2s;line-height:1}
.faq[open] summary .pl{transform:rotate(45deg)}
.faq .a{padding:0 0 18px;color:#444;font-size:14px;line-height:1.7}

/* FOOTER */
footer{margin-top:70px;border-top:1px solid var(--line);background:#fafafa}
.fg{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.3fr;gap:36px;padding:52px 0 40px}
.fg .logo{font-size:26px}
.fg p{color:#555;font-size:13.5px;line-height:1.7;margin-top:14px;max-width:34ch}
.fc h5{font-size:13px;font-weight:700;text-transform:uppercase;margin-bottom:14px}
.fc a{display:block;font-size:13.5px;color:#444;margin-bottom:10px;cursor:pointer}
.fc a:hover{color:var(--red)}
.pays{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.pays span{font-size:11px;font-weight:600;border:1px solid #d5d5d5;border-radius:4px;padding:4px 8px;color:#444;background:#fff}
.fb{border-top:1px solid var(--line);padding:18px 0;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:12.5px;color:#777}

/* FLOATING */
.wa-float{position:fixed;right:18px;bottom:96px;width:54px;height:54px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;z-index:55;box-shadow:0 6px 18px rgba(37,211,102,.45);transition:transform .15s}
.wa-float:hover{transform:scale(1.06)}
.wa-float svg{width:30px;height:30px}
.top-float{position:fixed;right:24px;bottom:34px;width:42px;height:42px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;z-index:55;opacity:0;pointer-events:none;transition:opacity .2s}
.top-float.show{opacity:1;pointer-events:auto}
.bnav{display:none}

/* OVERLAYS */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s;z-index:80}
.overlay.open{opacity:1;pointer-events:auto}
.side{position:fixed;top:0;height:100%;width:min(410px,92vw);background:#fff;z-index:90;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.4,0,.2,1)}
.side.left{left:0;transform:translateX(-100%)}
.side.right{right:0;transform:translateX(100%)}
.side.open{transform:none}
.side-h{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line)}
.side-h h3{font-size:18px;font-weight:700}
.xbtn{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--soft)}
.xbtn .ico{width:18px;height:18px}
.mlist a,.mlist button{display:flex;justify-content:space-between;align-items:center;width:100%;padding:15px 20px;border-bottom:1px solid var(--line);font-weight:600;font-size:15px;text-transform:uppercase;text-align:left}
.mlist a:hover,.mlist button:hover{color:var(--red)}
.mlist .sm{font-weight:500;text-transform:none;font-size:14px;color:#444}
.mlist .ico{width:18px;height:18px}
.side-items{flex:1;overflow:auto;padding:4px 20px}
.ci{display:flex;gap:12px;padding:16px 0;border-bottom:1px solid var(--line)}
.ci .cim{width:66px;height:88px;flex-shrink:0;background:var(--soft);overflow:hidden}
.ci .cim img{width:100%;height:100%;object-fit:cover}
.ci .cd{flex:1;min-width:0}
.ci .cn{font-weight:600;font-size:14px}
.ci .cm{font-size:12px;color:var(--muted);margin:2px 0 8px}
.qty{display:flex;align-items:center;border:1px solid var(--line);border-radius:4px;height:40px}
.qty button{width:32px;height:100%;font-size:17px;color:#555}
.qty button:hover{color:var(--red)}
.qty input{width:40px;height:100%;border:none;text-align:center;font-weight:600;outline:none;-moz-appearance:textfield;background:transparent}
.qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.ci .qty{height:32px;display:inline-flex}
.ci .qty button{width:28px}
.ci .qty span{min-width:28px;text-align:center;font-weight:600;font-size:13px}
.ci .cp{font-weight:700;font-size:15px;text-align:right;white-space:nowrap}
.ci .rm{display:block;font-size:12px;color:var(--muted);text-decoration:underline;margin-top:6px;margin-left:auto}
.empty{text-align:center;color:var(--muted);padding:60px 20px;line-height:1.7}

    <div class="sizes" id="qvSizes">${p.sizes.map(s=>`<button class="sz${qvSize===s?' on':''}" onclick="pickSize('${s}',this)">${s}</button>`).join("")}</div>
    <div class="szmsg" id="szmsg"></div>
    <div class="qv-buy"><div class="qty"><button onclick="stepQ(-1)" aria-label="Azalt">−</button><input id="qvQty" type="number" min="1" value="1" aria-label="Adet"><button onclick="stepQ(1)" aria-label="Artır">+</button></div><button class="addbtn" onclick="qvAdd()">Sepete Ekle</button></div>
    <button class="btn-wa" onclick="askWa()">${ICON.wa}WhatsApp'tan sor</button>
    <ul class="perks"><li>${ICON.truck}Türkiye'nin her yerine kargo${CONFIG.shipping.freeOver?`, ${short(CONFIG.shipping.freeOver)} üzeri ücretsiz`:""}</li><li>${ICON.shield}Havale / EFT ile ödeme</li><li>${ICON.store}${esc(CONFIG.city)} mağazasında da satışta</li></ul>
    <ul class="spec"><li><span>Kumaş</span><span>${esc(p.fabric)}</span></li><li><span>Kalıp</span><span>${esc(p.fitName)}</span></li><li><span>Bedenler</span><span>${p.sizes.join(", ")}</span></li></ul>
    <button class="share" onclick="shareP()">${ICON.share}Ürünü paylaş</button>
  </div></div>`;
  openModal("qvModal");
  try{history.replaceState(null,"","#urun-"+p.id);}catch(e){}
  if(fromAdd&&!qvSize)$("szmsg").textContent="Sepete eklemek için beden seçin.";
}
function pickSize(s,el){qvSize=s;document.querySelectorAll("#qvSizes .sz").forEach(b=>b.classList.remove("on"));el.classList.add("on");$("qvSizes").classList.remove("err");$("szmsg").textContent="";}
function stepQ(d){const el=$("qvQty");el.value=Math.min(99,Math.max(1,readQty(el)+d));}
function qvAdd(){if(!qvSize){$("qvSizes").classList.add("err");$("szmsg").textContent="Lütfen beden seçin.";return;}const q=readQty($("qvQty"));addToCart(qvP,qvSize,q);toast(`${qvP.name} (${qvSize}) sepete eklendi`);openSide("cart");}
function askWa(){waSend(`Merhaba, "${qvP.name}"${qvSize?" ("+qvSize+" beden)":""} hakkında bilgi almak istiyorum. ${location.href.split("#")[0]}#urun-${qvP.id}`);}
function shareP(){const url=location.href.split("#")[0]+"#urun-"+qvP.id,t=qvP.name+" — "+CONFIG.fullName;
  if(navigator.share){navigator.share({title:t,url}).catch(()=>{});}else{copyText(url);toast("Ürün linki kopyalandı");}}
function sizeGuide(){$("infoTitle").textContent="Beden tablosu";$("infoBody").innerHTML=`<table class="sgt"><tr><th>Beden</th><th>Göğüs (cm)</th><th>Boy (cm)</th></tr>${[["S",104,68],["M",110,70],["L",116,72],["XL",122,74],["XXL",128,76]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join("")}</table><p style="font-size:12.5px;margin-top:12px;color:#666">Ölçüler yaklaşıktır, modele göre değişebilir. Emin olamazsanız WhatsApp'tan boy-kilonuzu yazın, beden önerelim.</p>`;openModal("infoModal",true);}

/* ---------- SEPET ---------- */
function addToCart(p,size,q){const ex=cart.find(x=>x.id===p.id&&x.size===size);if(ex)ex.qty=Math.min(99,ex.qty+q);else cart.push({id:p.id,size,qty:q});save();renderCart();}
function changeQty(i,d){const it=cart[i];if(!it)return;it.qty+=d;if(it.qty<=0)cart.splice(i,1);save();renderCart();}
function removeItem(i){cart.splice(i,1);save();renderCart();}
function lines(){return cart.map(c=>({...P(c.id),size:c.size,qty:c.qty}));}
function totals(){const l=lines(),sub=l.reduce((s,i)=>s+i.qty*i.price,0),qty=l.reduce((s,i)=>s+i.qty,0);const s=CONFIG.shipping;const ship=!qty?0:(s.freeOver&&sub>=s.freeOver?0:s.fee);return{qty,sub,ship,total:sub+ship};}
function updateBadges(){const t=totals();document.querySelectorAll("[data-cart]").forEach(b=>b.textContent=t.qty);document.querySelectorAll("[data-fav]").forEach(b=>b.textContent=favs.length);}
function renderCart(){
  updateBadges();const l=lines(),t=totals();
  if(!l.length){$("cartItems").innerHTML=`<div class="empty">Sepetiniz boş.<br><button class="addbtn" onclick="setCat('Tümü',true)">Alışverişe başla</button></div>`;$("cartFoot").style.display="none";return;}
  $("cartFoot").style.display="block";
  $("cartItems").innerHTML=l.map((i,ix)=>`<div class="ci"><div class="cim"><img src="${i.img}" alt="" style="background:${i.bg}${i.fit==='contain'?';object-fit:contain':''}"></div>
    <div class="cd"><div class="cn">${esc(i.name)}</div><div class="cm">Beden: ${esc(i.size)} · ${money(i.price)}</div>
    <div class="qty"><button onclick="changeQty(${ix},-1)" aria-label="Azalt">−</button><span>${i.qty}</span><button onclick="changeQty(${ix},1)" aria-label="Artır">+</button></div></div>
    <div><div class="cp">${money(i.price*i.qty)}</div><button class="rm" onclick="removeItem(${ix})">Kaldır</button></div></div>`).join("");
  $("subtotal").textContent=money(t.sub);$("shipVal").textContent=t.ship?money(t.ship):"Ücretsiz";$("total").textContent=money(t.total);
  const fo=CONFIG.shipping.freeOver,sb=$("shipbar");
  if(!fo){sb.style.display="none";}else if(t.sub>=fo){sb.className="shipbar ok";sb.innerHTML=`✓ Kargo bedava!<div class="trk"><div class="fill" style="width:100%"></div></div>`;}
  else{sb.className="shipbar";sb.innerHTML=`Ücretsiz kargo için <b>${money(fo-t.sub)}</b> daha ekleyin.<div class="trk"><div class="fill" style="width:${Math.round(t.sub/fo*100)}%"></div></div>`;}
}

/* ---------- SIPARIS ---------- */
const ibanBox=()=>{const b=CONFIG.bank;return `<div class="iban">Banka: <b>${esc(b.name)}</b><br>Alıcı: <b>${esc(b.holder)}</b><br>IBAN: <b>${esc(b.iban)}</b><br><button class="copy" onclick="copyIban()">${ICON.copy}IBAN'ı kopyala</button></div>`;};
function copyIban(){copyText(CONFIG.bank.iban.replace(/\s/g,""));toast("IBAN kopyalandı");}
function openCheckout(){if(!cart.length)return;renderCheckout();openModal("coModal");}
function renderCheckout(){
  const t=totals();
  $("coContent").innerHTML=`<div class="co-grid"><div class="co-form"><h3>Siparişi tamamla</h3><div class="sub">Teslimat bilgilerinizi girin. Ödeme Havale / EFT ile yapılır.</div>
    <div class="field" id="f-ad"><label>Ad soyad *</label><input id="c-ad" autocomplete="name"></div>
    <div class="field" id="f-tel"><label>Telefon *</label><input id="c-tel" inputmode="tel" autocomplete="tel" placeholder="05xx xxx xx xx"></div>
    <div class="two"><div class="field" id="f-il"><label>İl *</label><input id="c-il" autocomplete="address-level1"></div><div class="field" id="f-ilce"><label>İlçe *</label><input id="c-ilce" autocomplete="address-level2"></div></div>
    <div class="field" id="f-adres"><label>Açık adres *</label><textarea id="c-adres" rows="2" autocomplete="street-address"></textarea></div>
    <div class="field"><label>Sipariş notu</label><input id="c-not" placeholder="İsteğe bağlı"></div>
    <div class="plbl">Ödeme yöntemi</div>
    <div class="paybox"><div class="pt">Havale / EFT</div><div class="pd">Siparişi onayladıktan sonra aşağıdaki hesaba ödeme yapın, dekontu WhatsApp'tan iletin.</div>${ibanBox()}</div>
  </div><div class="co-sum"><h4>Sipariş özeti</h4>
    ${lines().map(i=>`<div class="co-line"><span>${esc(i.name)} <span class="q">· ${esc(i.size)} · ×${i.qty}</span></span><span>${money(i.price*i.qty)}</span></div>`).join("")}
    <div class="co-line" style="border:none;padding-top:14px"><span class="q">Ara toplam</span><span>${money(t.sub)}</span></div>
    <div class="co-line" style="border:none;padding:3px 0"><span class="q">Kargo</span><span>${t.ship?money(t.ship):"Ücretsiz"}</span></div>
    <div class="sr2 total" style="margin-top:12px"><span>Toplam</span><span>${money(t.total)}</span></div>
    <button class="bigbtn" onclick="confirmOrder()">Siparişi onayla</button>
    <div class="secure">Siparişiniz WhatsApp üzerinden ${esc(CONFIG.fullName)}'ya iletilir.<br>Bilgileriniz yalnızca bu sipariş için kullanılır.</div></div></div>`;
}
function val(id){const el=$(id);return el?(el.value||"").trim():"";}
function confirmOrder(){
  const req=[["c-ad","f-ad"],["c-tel","f-tel"],["c-il","f-il"],["c-ilce","f-ilce"],["c-adres","f-adres"]];let ok=true,first=null;
  req.forEach(([i,f])=>{if(!val(i)){$(f).classList.add("err");ok=false;first=first||i;}else $(f).classList.remove("err");});
  if(!ok){toast("Lütfen zorunlu alanları doldurun");$(first).focus();return;}
  const t=totals(),ono=String(Math.floor(100000+Math.random()*900000));
  const m=[`*YENİ SİPARİŞ #${ono} — ${CONFIG.fullName}*`,"",`*Ad soyad:* ${val("c-ad")}`,`*Telefon:* ${val("c-tel")}`,`*Adres:* ${val("c-adres")}, ${val("c-ilce")}/${val("c-il")}`];
  if(val("c-not"))m.push(`*Not:* ${val("c-not")}`);
  m.push("","*Ürünler:*");lines().forEach(i=>m.push(`• ${i.name} — ${i.size} beden ×${i.qty} — ${money(i.price*i.qty)}`));
  m.push("",`Ara toplam: ${money(t.sub)}`,`Kargo: ${t.ship?money(t.ship):"Ücretsiz"}`,`*Toplam: ${money(t.total)}*`,`*Ödeme: Havale / EFT*`);
  waSend(m.join("\n"));
  $("coContent").innerHTML=`<div class="done"><div class="ok">✓</div><h3>Siparişiniz alındı</h3><div class="ono">Sipariş no: #${ono} · Toplam ${money(t.total)}</div>
    <p>Siparişiniz WhatsApp üzerinden bize iletildi. Aşağıdaki hesaba ödemeyi yapıp dekontu aynı sohbetten gönderin; ödeme onayından sonra siparişiniz kargoya verilir.</p>
    ${ibanBox()}
    <button class="bigbtn" onclick="waSend('Merhaba, #${ono} numaralı siparişimin dekontunu gönderiyorum.')">${ICON.wa.replace('<svg','<svg style="width:20px;height:20px"')}Dekontu WhatsApp'tan gönder</button>
    <button class="bigbtn dark" onclick="closeAll()">Alışverişe devam et</button></div>`;
  cart=[];save();renderCart();
}

/* ---------- BILGI SAYFALARI ---------- */
const INFO={
  teslimat:["Kargo & Teslimat","Siparişler ödeme onayından sonra kargoya verilir. Türkiye'nin her yerine gönderim yapılır."+(CONFIG.shipping.freeOver?" "+short(CONFIG.shipping.freeOver)+" ve üzeri siparişlerde kargo ücretsizdir, altındaki siparişlerde kargo ücreti "+short(CONFIG.shipping.fee)+"'dir.":"")],
  iade:["İade & Değişim","Beden değişimi ve iade talepleriniz için ürünü teslim aldıktan sonra WhatsApp hattımızdan bize ulaşın. Kullanılmamış ve etiketi sökülmemiş ürünlerde değişim yapılır."],
  mesafeli:["Mesafeli Satış Sözleşmesi","Satıcı bilgileri, ürün, teslimat ve cayma hakkı koşulları bu bölümde yer alır. (Mağazanın yasal metni eklenecek.)"],
  gizlilik:["Gizlilik / KVKK","Kişisel verileriniz yalnızca siparişinizin hazırlanması ve teslimatı için kullanılır, üçüncü kişilerle paylaşılmaz. (Mağazanın KVKK metni eklenecek.)"]
};
function info(k){$("infoTitle").textContent=INFO[k][0];$("infoBody").textContent=INFO[k][1];openModal("infoModal");}

/* ---------- PANELLER ---------- */
let lastModal=null;
function openSide(id){closeAll();$("overlay").classList.add("open");$(id).classList.add("open");}
function openModal(id,stack){if(stack&&$("qvModal").classList.contains("open")){lastModal="qvModal";$("qvModal").classList.remove("open");}else{lastModal=null;document.querySelectorAll(".side.open,.modal.open").forEach(e=>e.classList.remove("open"));}$("overlay").classList.add("open");$(id).classList.add("open");}
function closeAll(){if(lastModal&&$("infoModal").classList.contains("open")){$("infoModal").classList.remove("open");$(lastModal).classList.add("open");lastModal=null;return;}
  document.querySelectorAll(".overlay.open,.side.open,.modal.open").forEach(e=>e.classList.remove("open"));
  if(location.hash.startsWith("#urun-")){try{history.replaceState(null,"",location.pathname+location.search);}catch(e){}}}
let tT;function toast(m){const el=$("toast");el.textContent=m;el.classList.add("show");clearTimeout(tT);tT=setTimeout(()=>el.classList.remove("show"),2400);}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeAll();});
addEventListener("scroll",()=>$("topFloat").classList.toggle("show",scrollY>600),{passive:true});
function fromHash(){const m=location.hash.match(/^#urun-(\d+)$/);if(m&&P(+m[1]))openQuick(+m[1]);}
addEventListener("hashchange",fromHash);

renderGrid();renderCart();fromHash();
</script>
</body>
</html>
